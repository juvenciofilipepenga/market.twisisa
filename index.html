         ONLINE STORE
    ========================================================== -->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "OnlineStore",
        "@id": "https://market-twisisa.vercel.app/#store",
        "name": "Twisisa Market",
        "url": "https://market-twisisa.vercel.app/",
        "description": "Loja online em Moçambique com produtos, acessórios, artigos de beleza, eletrónicos, eletrodomésticos e produtos para casa.",

        "currenciesAccepted": "MZN",
        "priceRange": "MT",
        "areaServed": {
          "@type": "Country",
          "name": "Mozambique"
        },
        "paymentAccepted": [
          "M-Pesa",
          "e-Mola",
          "Visa"
        ]
      }
    </script>

    <!-- =========================================================
         WEBSITE SEARCH ACTION
    ========================================================== -->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "@id": "https://market-twisisa.vercel.app/#search",
        "name": "Twisisa Market",
        "url": "https://market-twisisa.vercel.app/",
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://market-twisisa.vercel.app/produtos?q={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      }
