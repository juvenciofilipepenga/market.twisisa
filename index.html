<!doctype html>
<html lang="pt-MZ">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <title>Twisisa Market | Faça suas compras online</title>

    <meta
      name="description"
      content="Faça suas compras online na Twisisa Market. Encontre produtos para casa, beleza, acessórios, eletrónicos e eletrodomésticos, com preços em meticais."
    />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <meta
      name="googlebot"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <meta
      name="author"
      content="Twisisa Market"
    />

    <meta
      name="application-name"
      content="Twisisa Market"
    />

    <meta
      name="theme-color"
      content="#140F0E"
    />

    <link
      rel="canonical"
      href="https://market-twisisa.vercel.app/"
    />

    <link
      rel="alternate"
      hreflang="pt-MZ"
      href="https://market-twisisa.vercel.app/"
    />

    <link
      rel="alternate"
      hreflang="x-default"
      href="https://market-twisisa.vercel.app/"
    />

    <!-- Open Graph -->

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="Twisisa Market"
    />

    <meta
      property="og:locale"
      content="pt_MZ"
    />

    <meta
      property="og:title"
      content="Twisisa Market | Faça suas compras online"
    />

    <meta
      property="og:description"
      content="Encontre produtos para casa, beleza, acessórios, eletrónicos e eletrodomésticos na Twisisa Market."
    />

    <meta
      property="og:url"
      content="https://market-twisisa.vercel.app/"
    />

    <meta
      property="og:image"
      content="https://market-twisisa.vercel.app/img/fundo-hero.webp"
    />

    <meta
      property="og:image:alt"
      content="Twisisa Market"
    />

    <!-- Twitter / X -->

    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Twisisa Market | Faça suas compras online"
    />

    <meta
      name="twitter:description"
      content="Produtos para casa, beleza, acessórios, eletrónicos e eletrodomésticos."
    />

    <meta
      name="twitter:image"
      content="https://market-twisisa.vercel.app/img/fundo-hero.webp"
    />

    <meta
      name="twitter:image:alt"
      content="Twisisa Market"
    />

    <!-- Ícones -->

    <link
      rel="icon"
      type="image/png"
      href="/logo.png"
    />

    <link
      rel="apple-touch-icon"
      href="/logo.png"
    />

    <link
      rel="manifest"
      href="/site.webmanifest"
    />

    <!-- Fontes -->

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Imagem principal -->

    <link
      rel="preload"
      as="image"
      href="/img/fundo-hero.webp"
      fetchpriority="high"
    />

    <!-- Organização -->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "@id": "https://market-twisisa.vercel.app/#organization",
        "name": "Twisisa Market",
        "url": "https://market-twisisa.vercel.app/",
        "logo": {
          "@type": "ImageObject",
          "url": "https://market-twisisa.vercel.app/logo.png"
        }
      }
    </script>

    <!-- Loja -->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "OnlineStore",
        "@id": "https://market-twisisa.vercel.app/#store",
        "name": "Twisisa Market",
        "url": "https://market-twisisa.vercel.app/",
        "description": "Loja online com produtos para casa, beleza, acessórios, eletrónicos e eletrodomésticos.",
        "logo": "https://market-twisisa.vercel.app/logo.png",
        "currenciesAccepted": "MZN",
        "areaServed": {
          "@type": "Country",
          "name": "Moçambique"
        },
        "paymentAccepted": [
          "M-Pesa",
          "e-Mola",
          "Visa"
        ]
      }
    </script>

    <!-- Website -->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "@id": "https://market-twisisa.vercel.app/#website",
        "name": "Twisisa Market",
        "url": "https://market-twisisa.vercel.app/",
        "inLanguage": "pt-MZ",
        "publisher": {
          "@id": "https://market-twisisa.vercel.app/#organization"
        }
      }
    </script>

    <!-- Pesquisa -->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "@id": "https://market-twisisa.vercel.app/#search",
        "name": "Twisisa Market",
        "url": "https://market-twisisa.vercel.app/",
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://market-twisisa.vercel.app/produtos?q={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>

  <body class="bg-bg text-ink font-sans antialiased">
    <div id="root"></div>

    <noscript>
      <main>
        <h1>Faça suas compras online na Twisisa Market</h1>

        <p>
          Encontre produtos para casa, beleza, acessórios,
          eletrónicos e eletrodomésticos.
        </p>

        <p>
          Consulte os produtos disponíveis e os preços em meticais.
          A Twisisa Market atende clientes em Moçambique,
          incluindo Maputo e Matola.
        </p>
      </main>
    </noscript>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
